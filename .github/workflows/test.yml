# taken from https://vitejs.dev/guide/static-deploy -cmw

# Simple workflow for deploying static content to GitHub Pages
name: Updater for potamap

on:
  # Runs on pushes targeting the default branch
  #   push:
  #     branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: src
          token: ${{ secrets.WORKFLOW_PAT }} # needed for commits

      - name: Checkout potamap park updater repo
        uses: actions/checkout@v4
        with:
          repository: "cwhelchel/potamap_park_updater"
          path: park_updater

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.13"
          cache: pip
          cache-dependency-path: park_updater/requirements.txt

      - name: Install dependencies
        run: pip install -r park_updater/requirements.txt

      - name: Run generator
        working-directory: park_updater
        run: |
          ls -la
          python run.py -o src/public/data

      - name: Commit and push changes
        working-directory: src
        run: |
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff
          git add .
          git status

      - name: Archive main source
        uses: actions/upload-artifact@v4
        with:
          name: src-folder
          path: |
            src
      - name: Archive tool artifacts
        uses: actions/upload-artifact@v4
        with:
          name: park_updater-folder
          path: |
            park_updater
